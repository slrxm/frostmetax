name: Update meta
on:
  schedule: [{cron: "0 4 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/update.py
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
      - run: |
          git config user.name "meta-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update meta" && git push)
